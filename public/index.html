    <script>
      // Automatically ensure trailing slash on GitHub Pages repository root paths
      // This guarantees that relative assets (./assets/...) resolve correctly rather than 404ing against the domain root
      (function() {
        var p = window.location.pathname;
        if (!p.endsWith('/') && !p.split('/').pop().includes('.')) {
          window.location.replace(p + '/' + window.location.search + window.location.hash);
        }
      })();
    </script>
